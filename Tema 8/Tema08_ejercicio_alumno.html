<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ejercicios – Tema 8 con Bootstrap 5</title>
	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<style>
		.card+.card {
			margin-top: 1rem
		}
	</style>
</head><!--By Manuel Robles Barrales AKKA Kiriel/Kiri-->

<body class="bg-light">
	<div class="container pgit 
			<h1 class= " mb-4">Ejercicios - Tema 8: Validación de formularios</h1>
		<p class="text-muted">Se mantiene el patrón de validación con <code>addEventListener('submit', …)</code> y
			validación HTML5 donde corresponde.</p>

		<!-- EJ1 -->
		<div class="card">
			<div class="card-header">Ejercicio 1 – JS básico</div>
			<div class="card-body">
				<form id="bs-form-ej1" class="row g-3" novalidate>
					<div class="col-md-6">
						<label for="usuario" class="form-label">Usuario</label>
						<input class="form-control" type="text" name="usuario">
					</div>
					<div class="col-md-6">
						<label for="clave" class="form-label">Contraseña</label>
						<input class="form-control" type="password" name="clave">
					</div>
					<div class="col-12">
						<button class="btn btn-primary" type="submit">Enviar</button>
					</div>
				</form>
				<div id="bs-msg-ej1" class="mt-2"></div>
			</div>

			<!-- EJ2 -->
			<div class="card">
				<div class="card-header">Ejercicio 2 – JS básico</div>
				<div class="card-body">
					<form id="bs-form-ej2" class="row g-3">
						<div class="col-md-6">
							<label for="E-mail" class="form-label">E-mail</label>
							<input class="form-control" type="email" name="email" required>
						</div>

						<div class="col-md-6">
							<label for="Edad" class="form-label">Edad</label>
							<input class="form-control" type="number" name="Edad" min="18" max="120" required>
						</div>

						<div class="col-md-6">
							<label for="contraseña" class="form-label">Contraseña</label>
							<input class="form-control" type="password" name="contraseña" minlength="6" required>
						</div>

						<div class="col-12">
							<button class="btn btn-primary" type="submit">Enviar</button>
						</div>
					</form>
					<div id="bs-msg-ej2" class="mt-2"></div>

					<!-- EJ3 -->
					<div class="card">
						<div class="card-header">Ejercicio 3 – JS básico</div>
						<div class="card-body">
							<form id="bs-form-ej3" class="row g-3">
								<!--Sin el novalidate, los else no muestran los alert-->
								<div class="col-md-6">
									<label for="Nombre y apellidos" class="form-label">Nombre y apellidos</label>
									<input class="form-control" type="text" name="Nombre_Y_Apellidos"
										pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\- ]+"
										title="Solo se pueden carácteres de la A a la Z, no se permiten carácteres especiales tales como: ' - _ o @ '"
										required>
								</div>

								<div class="col-12">
									<button class="btn btn-primary" type="submit">Enviar</button>
								</div>
							</form>
							<div id="bs-msg-ej3" class="mt-2"></div>
						</div>

						<!-- EJ4 -->
						<div class="card">
							<div class="card-header">Ejercicio 4 – JS básico</div>
							<div class="card-body">
								<form id="bs-form-ej4" class="row g-3">
									<div class="col-md-6">
										<label for="contraseña" class="form-label">Contraseña</label>
										<input class="form-control" type="password" name="contraseña" minlength="6"
											required>
									</div>

									<div class="col-md-6">
										<label for="repetirContraseña" class="form-label">Repetir contraseña</label>
										<input class="form-control" type="password" name="repetirContraseña"
											minlength="6" required>
									</div>

									<div class="col-12">
										<button class="btn btn-primary" type="submit">Enviar</button>
									</div>
								</form>
								<div id="bs-msg-ej4" class="mt-2"></div>
							</div>

							<!-- EJ5 -->
							<div class="card">
								<div class="card-header">Ejercicio 5 – JS básico</div>
								<div class="card-body">
									<form id="bs-form-ej5" class="row g-3">

										<div class="col-md-6">
											<label for="Nombre y apellidos" class="form-label">Nombre y
												apellidos</label>
											<input class="form-control" type="text" name="Nombre_Y_Apellidos"
												pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\- ]+"
												title="Solo se pueden carácteres de la A a la Z, no se permiten carácteres especiales tales como: ' - _ o @ '"
												required>
										</div>

										<div class="col-md-6">
											<label for="E-mail" class="form-label">E-mail</label>
											<input class="form-control" type="email" name="email" required>
										</div>

										<div class="col-md-6">
											<label for="edad" class="form-label">Edad</label>
											<input class="form-control" type="number" name="edad" min="18" max="120"
												required>
										</div>

										<div class="col-md-6">
											<label for="contraseña" class="form-label">Contraseña</label>
											<input class="form-control" type="password" name="contraseña" minlength="6"
												required>
										</div>

										<div class="col-md-6">
											<label for="repetirContraseña" class="form-label">Repetir contraseña</label>
											<input class="form-control" type="password" name="repetirContraseña"
												minlength="6" required>
										</div>

										<div class="col-md-6">
											<label for="checkbox" class="form-label">Acepto términos</label>
											<input class="form-check" type="checkbox" name="AceptarTerminos" required>
										</div>

										<div class="col-12">
											<button class="btn btn-primary" type="submit">Enviar</button>
										</div>
									</form>
									<div id="bs-msg-ej5" class="mt-2"></div>
								</div>
							</div><!--Div card body-->
						</div><!--Div del card-->
						<!-- Bootstrap 5 JS (bundle con Popper) -->
						<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
							integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
							crossorigin="anonymous"></script>
						<script>
							// TODO: Aquí va el código de validación 
							//EJ 1
							document.getElementById('bs-form-ej1').addEventListener('submit', function (e) {
								e.preventDefault();
								const usuario = this.usuario.value.trim();
								const clave = this.clave.value.trim();
								const mensajeDiv = document.getElementById('bs-msg-ej1');
								if (usuario === '' || clave === '') {
									mensajeDiv.innerHTML = '<div class="alert alert-danger">Todos los campos son obligatorios.</div>';
									alert('Campos vacíos, rellenalos');
									return;
								}
								mensajeDiv.innerHTML = '<div class="alert alert-success">Envío del formulario correcto</div>';
								this.submit();

							});
							//Ej 2
							document.getElementById('bs-form-ej2').addEventListener('submit', function (e) {
								e.preventDefault();
								document.getElementById('bs-msg-ej2').innerHTML = '<div class="alert alert-success">El formulario ha sido enviado</div>';
							});
							//Ej 3
							document.getElementById('bs-form-ej3').addEventListener('submit', function (e) {
								e.preventDefault();

								const validarPattern = this.Nombre_Y_Apellidos;
								const nombre = validarPattern.value.trim();
								if (validarPattern.checkValidity()) {
									alert('Carácteres correctos');
								}
								else {
									alert('Carácteres Incorrectos');
									console.log('Carácteres Incorrectos');
								}
								if (validarPattern.reportValidity()) {
									alert('Nombre válido,' + nombre)
								}
								else {
									alert('Nombre inválido,' + nombre)
									console.log('Nombre inválido,' + nombre);
								}

								document.getElementById('bs-msg-ej3').innerHTML = '<div class="alert alert-success">El formulario ha sido enviado</div>';
							});
							//Ej 4
							document.getElementById('bs-form-ej4').addEventListener('submit', function (e) {
								e.preventDefault();
								const contraseña = this.contraseña.value.trim();
								const repetirContraseña = this.repetirContraseña.value.trim();
								const mensajeDiv = document.getElementById('bs-msg-ej4');

								if (contraseña === repetirContraseña) {

									document.getElementById('bs-msg-ej4').innerHTML = '<div class="alert alert-success">El formulario ha sido enviado</div>';
									return;
								}

								document.getElementById('bs-msg-ej4').innerHTML = '<div class="alert alert-danger">Las contraseñas no son iguales</div>';
							});
							//Ej 5
							document.getElementById('bs-form-ej5').addEventListener('submit', function (e) {
								e.preventDefault();
								const contraseña = this.contraseña.value.trim();
								const repetirContraseña = this.repetirContraseña.value.trim();

								if (contraseña === repetirContraseña) {
									const datos_enviados = {
										nombre: this.Nombre_Y_Apellidos.value.trim(),
										email: this.email.value.trim(),
										edad: this.edad.value.trim(),
										contraseña: this.contraseña.value.trim(), //Esta no debe ponerse en un caso real, lo sé, es un dato sensible que no debe mostrarse
										acepta_terminos: this.AceptarTerminos.checked

									}
									const datos_enviadosJSON = JSON.stringify(datos_enviados, null, 2);
									document.getElementById('bs-msg-ej5').innerHTML = '<div class="alert alert-success">El formulario ha sido enviado</div>' +
										'<div><strong>Datos enviados JSON </strong> <br> </div>' + '<pre>' + datos_enviadosJSON + '</pre>'

									return;
								}
								
								document.getElementById('bs-msg-ej5').innerHTML = '<div class="alert alert-danger">Las contraseñas no son iguales</div>';
							});
						</script>
</body>

</html>
